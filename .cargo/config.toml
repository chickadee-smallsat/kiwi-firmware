[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Default runner using probe-rp-usb.
runner = "probe-rp-usb run --family rp2xxx-absolute" # RP2350x and RP2040
# This is suitable for Kiwi. 
# If you are not using the Raspberry Pi Debug Probe, comment out the probe-rs runner and uncomment the picotool runner for Raspberry Pi Pico.
# runner = "probe-rs run --chip RP235x --protocol swd" 

# For a single image that does not need the separate flash-wifi-fw script, add the
# monolithic feature (embeds the WiFi/BT blobs): cargo run --release --features monolithic

# Alternative runner for Raspberry Pi Pico, using picotool. Uncomment this line and comment the probe-rs line to use this runner.
# runner = "picotool load -u -v -x --force"

[build]
target = "thumbv8m.main-none-eabihf" # RP2350x

[target.thumbv8m.main-none-eabihf]
linker = "rust-lld"
rustflags = [
    "-C",
    "link-arg=--nmagic",
    "-C",
    "link-arg=-Tlink.x",
    "-C",
    "link-arg=-Tdefmt.x",
]

[env]
# cyw43::runner warns on every non-0x886c packet on the event channel, which
# the reference drivers (brcmfmac, WHD) silently drop; keep only its errors.
DEFMT_LOG = "info,cyw43::runner=error" # Set the default log level for defmt
EMBASSY_TASK_WATCHDOG_MAX_TASKS = "8" # Set the maximum number of tasks for the Embassy task watchdog
EMBASSY_USB_MAX_INTERFACE_COUNT = "8" # Set the maximum number of USB interfaces for the Embassy USB stack
